<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - Gestión Saber Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div style="font-size: 4rem; margin-bottom: 1rem;">📚</div>
                <h1>Gestión Saber Pro</h1>
                <p>Plataforma de Resultados UTS</p>
            </div>
            
            <!-- Mensajes -->
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>
            
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>
            
            <!-- Formulario -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">👤 Usuario</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           placeholder="Escribe tu usuario"
                           required 
                           autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">🔐 Contraseña</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Escribe tu contraseña"
                           required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                    Acceder al Sistema →
                </button>
            </form>
            
            <div class="text-center mt-3">
                <p style="color: #757575;">¿Primera vez aquí? <a th:href="@{/registro}" style="color: #5E35B1; font-weight: 600;">Crear cuenta</a></p>
            </div>
            
            <div style="background: linear-gradient(135deg, #E8F5E9 0%, #E3F2FD 100%); padding: 1.2rem; border-radius: 12px; margin-top: 1.5rem;">
                <h4 style="margin-bottom: 0.5rem; color: #5E35B1; font-size: 0.9rem;">🔑 Accesos de Prueba</h4>
                <p style="margin: 0.3rem 0; font-size: 0.85rem; color: #424242;"><strong>Admin:</strong> <code style="background: #fff; padding: 2px 6px; border-radius: 4px;">coordinador</code> / <code style="background: #fff; padding: 2px 6px; border-radius: 4px;">123456</code></p>
                <p style="margin: 0.3rem 0; font-size: 0.85rem; color: #424242;"><strong>Usuario:</strong> <code style="background: #fff; padding: 2px 6px; border-radius: 4px;">estudiante</code> / <code style="background: #fff; padding: 2px 6px; border-radius: 4px;">123456</code></p>
            </div>
        </div>
    </div>
</body>
</html>
