<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Gestión Saber Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div style="font-size: 3.5rem; margin-bottom: 1rem;">✨</div>
                <h1>Crear Cuenta</h1>
                <p>Únete a la plataforma</p>
            </div>
            
            <!-- Mensajes -->
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>
            
            <!-- Formulario -->
            <form th:action="@{/registro}" method="post">
                <div class="form-group">
                    <label for="nombreCompleto" class="form-label">📝 Nombre Completo</label>
                    <input type="text" 
                           id="nombreCompleto" 
                           name="nombreCompleto" 
                           class="form-control" 
                           placeholder="Ej: Carlos Andrés Pérez"
                           required>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">📧 Email</label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           class="form-control" 
                           placeholder="tucorreo@email.com"
                           required>
                </div>
                
                <div class="form-group">
                    <label for="username" class="form-label">👤 Nombre de Usuario</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           placeholder="Ej: carlosperez"
                           required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">🔐 Contraseña</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Mínimo 6 caracteres"
                           minlength="6"
                           required>
                </div>
                
                <div class="form-group">
                    <label for="rol" class="form-label">🎭 Perfil</label>
                    <select id="rol" name="rol" class="form-control" required>
                        <option value="ESTUDIANTE" selected>Soy Estudiante</option>
                        <option value="COORDINADOR">Soy Coordinador</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-success" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                    ✓ Crear mi cuenta
                </button>
            </form>
            
            <div class="text-center mt-3">
                <p style="color: #757575;">¿Ya tienes cuenta? <a th:href="@{/login}" style="color: #00897B; font-weight: 600;">Acceder aquí</a></p>
            </div>
        </div>
    </div>
</body>
</html>
